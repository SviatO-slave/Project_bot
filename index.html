<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Їж, щоб рости</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky day header, scrolling cards, bottom tab bar (Telegram Mini App feel) */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --fg:#17201B; --muted:#5E6B63; --line:#DDE3DE;
  --accent:#1F6B4E; --accent-ink:#FFFFFF; --accent-soft:#DDEFE6;
  --iron:#2B3530; --amber:#B86B00; --amber-soft:#FBEBD3; --warn:#B3261E; --warn-soft:#FBE3E1;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  --sab:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --vh:var(--tg-viewport-stable-height,100vh);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#18201C; --fg:#E7EEE9; --muted:#9AA8A0; --line:#2A3530;
  --accent:#4FBF8E; --accent-ink:#06130D; --accent-soft:#183428;
  --iron:#C9D4CE; --amber:#F0A847; --amber-soft:#3A2A12; --warn:#FF8A80; --warn-soft:#3B1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#18201C; --fg:#E7EEE9; --muted:#9AA8A0; --line:#2A3530;
  --accent:#4FBF8E; --accent-ink:#06130D; --accent-soft:#183428;
  --iron:#C9D4CE; --amber:#F0A847; --amber-soft:#3A2A12; --warn:#FF8A80; --warn-soft:#3B1916; color-scheme:dark}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding:0 16px calc(90px + var(--sab))}
body.typing .app{padding-bottom:24px}
.num{font-variant-numeric:tabular-nums}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 6px;display:grid;gap:3px;justify-items:center;font-weight:700;font-size:13px;min-width:0}
.day i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day i.ok{background:var(--accent)} .day i.lo{background:var(--amber)} .day i.bad{background:var(--warn)}
.day[aria-pressed="true"]{background:var(--iron);color:var(--bg);border-color:var(--iron)}
/* banners */
.banner{background:var(--amber-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:12px}
.banner.w{background:var(--warn-soft)}
.banner button{border:0;background:var(--amber);color:var(--bg);font-weight:700;border-radius:999px;padding:7px 12px;white-space:nowrap}
.banner.w button{background:var(--warn)}
/* day summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.meter{display:grid;gap:6px;min-width:0}
.meter .lbl{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.meter .val{font-size:20px;font-weight:700}
.meter .val span{font-size:13px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar b.lo{background:var(--amber)} .bar b.hi{background:var(--warn)}
.cost{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;font-size:14px;color:var(--muted)}
.cost strong{color:var(--fg);font-size:17px}
/* meals */
.list{display:grid;gap:10px;margin-top:12px}
.meal{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:start}
.meal.bad{border-color:var(--warn);background:var(--warn-soft)}
.meal .t{font-weight:700;color:var(--muted);font-size:13px;padding-top:2px}
.meal .n{font-weight:700}
.meal .m{font-size:13px;color:var(--muted);margin-top:3px}
.meal .x{font-family:var(--f-display);font-size:13px;color:var(--accent);padding-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.sw{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.bad{background:var(--warn);color:var(--bg);border-color:transparent}
.foot{color:var(--muted);font-size:13px;margin:14px 2px 0;display:grid;gap:4px}
/* sections */
.sec{display:grid;gap:10px;margin-top:16px}
.h2{font-family:var(--f-display);font-size:15px;margin:6px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv div{display:grid;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kv strong{font-size:17px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:8px 2px 0}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left}
.item .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--accent-ink)}
.item.done .box{background:var(--accent);border-color:var(--accent)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item.ex .box{background:var(--warn);border-color:var(--warn);color:var(--bg)}
.item .nm{font-weight:600}
.item .q{font-size:13px;color:var(--muted)}
.item .pr{font-weight:700;font-size:14px;text-align:right}
.rows{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row span:first-child{min-width:0}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin:0}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:var(--bg)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* form */
.form{display:grid;gap:14px}
.fs{display:grid;gap:12px;border:0;margin:0;padding:0 0 14px;border-bottom:1px dashed var(--line)}
.fs:last-of-type{border-bottom:0}
.fs legend{font-family:var(--f-display);font-size:14px;padding:0;margin-bottom:12px}
.fld{display:grid;gap:6px;min-width:0}
.fld label,.fld .lb{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-width:0;-webkit-appearance:none;appearance:none}
.fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--iron);color:var(--bg);border-color:var(--iron)}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.75;margin-top:2px;line-height:1.25}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.big{font-family:var(--f-display);font-size:34px;line-height:1.1}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.okmsg{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.info{background:var(--amber-soft);border-radius:12px;padding:10px 12px;font-size:13px}
details.tip{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.tip summary{font-weight:700;padding:12px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";color:var(--muted);font-weight:700}
details.tip[open] summary::after{content:"−"}
details.tip div{padding:0 0 14px;font-size:14px;display:grid;gap:8px}
details.tip p{margin:0}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sab))}
body.typing .tabs{display:none}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:transparent;border-radius:12px;padding:8px 2px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:20px 20px 0 0;max-height:calc(var(--vh) * .88);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px calc(18px + var(--sab))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:12px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.sheet h3{font-family:var(--f-display);font-size:18px;margin:0;text-wrap:balance}
.alt{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.alt .a{min-width:0;font-weight:600}
.alt .b{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.tog{display:flex;gap:6px;flex-wrap:wrap}
.tog button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
.tog button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--bg)}
/* intro */
.intro{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;justify-content:space-between;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(20px + var(--sab));max-width:560px;margin:0 auto}
.intro .step{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.intro h2{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:10px 0 14px;text-wrap:balance}
.intro p{margin:0 0 10px;font-size:16px;color:var(--muted)}
.intro ul{margin:6px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{width:22px;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 4px 10px 50px;margin-top:-4px}
.subs .lb{width:100%;font-size:12px;color:var(--muted);opacity:.8}
.subs button{font:inherit;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;min-height:34px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.subs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px;align-items:stretch}
.meal{grid-template-columns:minmax(0,1fr) auto!important}
.meal .sl{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.mv{display:grid;grid-template-rows:1fr 1fr;gap:6px}
.mv button{display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--fg);min-height:40px;padding:0}
.mv button svg{width:18px;height:18px}
.mv button:disabled{opacity:.3}
.item.fav .box{background:var(--accent);border-color:var(--accent)}
.item.done.fav .nm{text-decoration:none;color:inherit}
.item:disabled{opacity:.55}
/* QA fixes: narrow screens & long texts */
.row span:last-child{white-space:nowrap;flex-shrink:0;text-align:right}
.sheet{overflow-x:hidden}
.sheet .in{grid-template-columns:minmax(0,1fr)}
.alt .a{flex:1 1 auto}
.alt .b{white-space:normal;flex:0 0 auto;max-width:48%}
.kv{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.kv span{overflow-wrap:anywhere;line-height:1.25}
.banner{flex-wrap:wrap}
.banner span{flex:1 1 170px}
.meal .n,.item .nm,.alt .a,.row span:first-child{overflow-wrap:anywhere}
@media (max-width:359px){
  .brand h1{font-size:17px}
  .brand .k{display:none}
  .meal{grid-template-columns:40px minmax(0,1fr) auto;gap:8px;padding:12px}
  .day{font-size:12px}
  .tab{font-size:11px}
  .meter .val{font-size:18px}
  .meters{gap:10px}
  .big{font-size:28px}
  .seg button{min-width:fit-content;flex:1 1 auto;padding:10px}
  .trio{gap:6px}
  .fld input,.fld select{padding:10px}
}
</style>
</head>

    if(pr.lac==="так")tags.add("Л");if(pr.bob==="так")tags.add("Б");}
  if(tags.has("Г"))tags.delete("Г*");
  return {kc,p,f,c,cost,miss,tags:[...tags]};
}

function effItems(name){
  const d=DATA.dishes[name],ex=S.prefs.excl,sub=S.prefs.sub||{},tot=BASE[name].kc;
  const items=[],notes=[],left=[];
  for(const [pn,g] of d.i){

    const opt=(SUBS[pn]||[]).find(o=>subLabel(o)===sub[pn]);
    if(!opt){left.push(pn);items.push([pn,g,null]);continue}
    const pr=PROD[pn],kcI=g*pr.ed/100*pr.kc;

    const to=PROD[opt[0]],gr=opt[1]==="k"?kcI/(to.kc*to.ed/100):g*opt[1];
    items.push([opt[0],Math.round(gr/5)*5,pn]);notes.push(short(opt[0]).toLowerCase()+" замість: "+short(pn).toLowerCase())}

/* ---- calculator ---- */
function calc(pf){
  const P=pf||SAMPLE;
  const bmr=Math.round(10*P.w+6.25*P.h-5*P.age+(P.sex==="Чоловік"?5:-161));
  const strW=(STR_MET-1)*P.w*P.strN*P.strMin/60;
  const met=CARDIO[P.cardio]?CARDIO[P.cardio][1]:0;
  const carW=met?(met-1)*P.w*P.cN*P.cMin/60:0;
  const ex=Math.round((strW+carW)/7);
  const fMaint=Math.round(bmr*LIFE[P.life][1]+ex);
  let maint=fMaint,src="за формулою";
  const warns=[];
  if(P.cur>0){const d=P.trend==="Росте"?P.trendKg:P.trend==="Падає"?-P.trendKg:0;
    maint=Math.round(P.cur-d*1100);src="з твого фактичного харчування";
    const dev=maint/fMaint;
    if(dev<.75||dev>1.25)warns.push(`Твоя фактична підтримка сильно відрізняється від розрахунку за формулою (${fmt(fMaint)} ккал). Перевір, чи точно рахуєш усе з'їдене, включно з олією й перекусами.`)}
  const adj=P.goal==="Набір маси"?1.12:P.goal==="Рельєф"?.85:1;
  const rec=Math.round(Math.max(maint*adj,bmr)/50)*50;
  const own=P.want>0;const kcal=own?Math.round(P.want):rec;
  const diff=kcal/maint-1;
  if(own){
    if(kcal<bmr)warns.push(`${fmt(kcal)} ккал — нижче базового обміну (${fmt(bmr)}). Так худнути не варто: йтимуть м'язи й сили. Рекомендовано: ${fmt(rec)} ккал.`);
    else if(diff<-.25)warns.push(`Дефіцит ${Math.round(-diff*100)}% — занадто різко, важко втримати і шкода м'язам. Рекомендовано: ${fmt(rec)} ккал.`);
    if(diff>.2)warns.push(`Профіцит ${Math.round(diff*100)}% — набиратимеш переважно жир. Рекомендовано: ${fmt(rec)} ккал.`);
    if(P.goal==="Рельєф"&&diff>0)warns.push("Ціль — рельєф, але ця калорійність вища за підтримку, тож вага не йтиме вниз.");
    if(P.goal==="Набір маси"&&diff<0)warns.push("Ціль — маса, але ця калорійність нижча за підтримку, тож набору не буде.");
  }
  const prot=Math.round(Math.min(P.w*(P.goal==="Рельєф"?2:P.goal==="Набір маси"?1.8:1.6),220));
  const fat=Math.round(Math.max(.8*P.w,kcal*.25/9));
  const carb=Math.max(Math.round((kcal-prot*4-fat*9)/4),0);
  const bmi=Math.round(P.w/((P.h/100)**2)*10)/10;
  if(P.age<18||P.w<40||P.h<140)warns.unshift("Розрахунок призначений для дорослих 18+ зі звичайними параметрами.");
  else if(bmi<17)warns.unshift("ІМТ дуже низький. Перед зміною харчування порадься з лікарем.");
  else if(P.goal==="Рельєф"&&bmi<20)warns.unshift("При такому ІМТ сушка не потрібна. Краще обрати «Підтримку» або «Набір маси».");
  else if(bmi>=30)warns.unshift("При ІМТ 30+ план краще узгодити з лікарем.");
  const rate=(kcal-maint)*7/7700;
  const pace=Math.abs(rate)<.1?"вага стабільна":(rate>0?"+":"−")+fmt(Math.abs(rate),1)+" кг на тиждень";
  return {bmr,ex,fMaint,maint,src,rec,kcal,own,diff,prot,fat,carb,bmi,warns,pace};
}

function conflict(name){const P=S.prefs;if(P.dis[name])return "не подобається";

}

    <li>У середу ввечері — друга заготовка на Чт–Пт, у вихідні готуєш свіже.</li>
    <li>Охолоди до кімнатної не довше 1–2 годин і в холодильник.</li>
    <li>Розігрівай до гарячого по всьому об'єму, вдруге не зберігай.</li></ul></div></div>`;
}

function seg(id,opts,val){return `<div class="seg" role="group" id="${id}">${opts.map(o=>`<button type="button" data-seg="${id}" data-v="${esc(o)}" aria-pressed="${o===val}">${esc(o)}</button>`).join("")}</div>`}
const nv=v=>v>0?v:"";
const TIPS=[
 ["Як користуватися",`<p>1. У «Профілі» введи свої дані й ціль. Меню на тиждень підбереться саме, а порції підженуться під твої калорії.</p><p>2. У «Меню» торкнись страви, щоб побачити продукти в грамах або замінити її на будь-яку іншу з тією ж калорійністю. Стрілки ↑↓ збоку міняють страви місцями, наприклад гейнер на ранок.</p><p>3. У «Профілі» → «Мій розклад» обери 3, 4 чи 5 прийомів на день і улюблені страви — тиждень складеться з них.</p><p>4. «Покупки» — список на тиждень з галочками. «Заготовка» — що приготувати в неділю на понеділок і вівторок.</p><p>5. Не їси якийсь продукт — познач у «Профілі» → «Що не їм» і обери, чим його замінювати (наприклад, молоко → вода, свинина → курка). Тоді страви лишаться в меню. Якщо заміни немає — страва підсвітиться, і ти обереш іншу.</p>`],
 ["Як зважуватись і коригувати калорії",`<p>Зважуйся 1–2 рази на тиждень зранку, після туалету й до їжі. Дивись на середнє за 2 тижні: вага щодня скаче на 0,5–1 кг через воду й сіль.</p><p>Маса: якщо за 2 тижні вага не росте — додай 150–200 ккал у полі «Хочу їсти». Росте швидше за 0,5 кг на тиждень — забери 150.</p><p>Рельєф: якщо за 2 тижні вага стоїть — мінус 150–200 ккал. Падає швидше за 1% від ваги на тиждень — додай 150.</p>`],
 ["Дні тренувань і відпочинку",`<p>Витрата від тренувань і кардіо рахується як середнє на день, тому меню однакове щодня.</p><p>Реально в дні тренувань ти витрачаєш більше, а в дні відпочинку менше. Це нормально: за тиждень усе вирівнюється.</p><p>Якщо в день довгого кардіо сильно голодний — додай перекус. У день відпочинку можна пропустити перекус, якщо не хочеться їсти.</p>`],
 ["Як працює заготовка",`<p>Готова їжа в холодильнику безпечно стоїть до 3 діб, тому неділя покриває лише понеділок і вівторок.</p><p>У середу ввечері — друга коротка заготовка на четвер і п'ятницю. Вихідні — готуєш свіже.</p><p>Хочеш один раз на тиждень — порції на Чт–Пт одразу клади в морозилку, а ввечері перед днем перекладай у холодильник.</p>`],
 ["Креатин і протеїн",`<p><b>Протеїн</b> — це просто зручна форма білка, а не обов'язкова добавка. Якщо білок у меню набирається з їжі, він не потрібен. Порівнюй ціну 100 г білка з куркою, яйцями чи сиром.</p><p><b>Креатин моногідрат</b> — одна з найдосліджених добавок для силових тренувань. У дослідженнях зазвичай беруть 3–5 г на день щодня і п'ють достатньо води. Без «завантаження» він теж працює, просто трохи повільніше.</p><p>Якщо є проблеми з нирками чи ти приймаєш ліки — перед будь-якими добавками порадься з лікарем.</p>`],
 ["Коли звернутися до лікаря",`<p>Постійне здуття, біль у животі чи розлади після певних продуктів. Різке схуднення без причини. Запаморочення, слабкість, перебої в роботі серця на тренуваннях.</p><p>А також якщо ловиш себе на тому, що їжа чи вага стали постійним джерелом тривоги. Додаток допомагає планувати харчування, але не замінює лікаря.</p>`]];
function viewMe(){
  const P=S.profile||SAMPLE,c=calc(P),np=Object.keys(S.prefs.excl).length+Object.keys(S.prefs.dis).length+(S.prefs.noGl+S.prefs.noLac+S.prefs.noBob);
  return `<header class="top"><div class="brand"><h1>Профіль</h1><small>${S.profile?"твої дані":"приклад — зміни під себе"}</small></div></header>
  <form class="form card" id="pf" novalidate>
    <fieldset class="fs"><legend>Про тебе</legend>
      <div class="fld"><span class="lb">Стать</span>${seg("sex",["Чоловік","Жінка"],P.sex)}</div>
      <div class="trio">
        <div class="fld"><label for="w">Вага, кг</label><input id="w" type="number" inputmode="decimal" min="40" max="200" step="0.1" value="${P.w}"></div>
        <div class="fld"><label for="h">Зріст, см</label><input id="h" type="number" inputmode="numeric" min="140" max="220" value="${P.h}"></div>
        <div class="fld"><label for="age">Вік</label><input id="age" type="number" inputmode="numeric" min="18" max="80" value="${P.age}"></div></div>
    </fieldset>
    <fieldset class="fs"><legend>Активність</legend>
      <div class="fld"><span class="lb">Протягом дня</span><div class="seg" role="group" id="life">${LIFE.map((x,i)=>`<button type="button" data-seg="life" data-v="${esc(x[0])}" aria-pressed="${i===P.life}">${esc(x[0])}<small>${esc(x[2])}</small></button>`).join("")}</div><p class="hint">Обирай за середньою кількістю кроків на день — її видно в телефоні чи годиннику. Окремі прогулянки «для кардіо» від 30 хвилин краще внести нижче в кардіо як «Швидка ходьба».</p></div>
      <div class="duo">
        <div class="fld"><label for="strN">Силові, разів на тиждень</label><input id="strN" type="number" inputmode="numeric" min="0" max="14" value="${P.strN}"></div>
        <div class="fld"><label for="strMin">Хвилин за раз</label><input id="strMin" type="number" inputmode="numeric" min="0" max="240" value="${P.strMin}"></div></div>
      <div class="fld"><label for="cardio">Кардіо</label><select id="cardio">${CARDIO.map((x,i)=>`<option value="${i}" ${i==P.cardio?"selected":""}>${x[0]}</option>`).join("")}</select></div>
      <div class="duo">
        <div class="fld"><label for="cN">Кардіо, разів на тиждень</label><input id="cN" type="number" inputmode="numeric" min="0" max="14" value="${nv(P.cN)}" placeholder="0"></div>
        <div class="fld"><label for="cMin">Хвилин за раз</label><input id="cMin" type="number" inputmode="numeric" min="0" max="300" value="${nv(P.cMin)}" placeholder="0"></div></div>
      <p class="hint">Тренування й кардіо рахуються як середнє на день. У дні відпочинку ти витрачаєш менше, у дні тренувань — більше, і за тиждень це вирівнюється.</p>
    </fieldset>
    <fieldset class="fs"><legend>Як їси зараз <span class="hint" style="font-family:var(--f-body)">· необов'язково</span></legend>
      <div class="fld"><label for="cur">Скільки ккал їм зараз на день</label><input id="cur" type="number" inputmode="numeric" min="0" max="7000" value="${nv(P.cur)}" placeholder="не знаю — порахувати за формулою"></div>
      <div class="fld"><span class="lb">Вага за останні 2–3 тижні</span>${seg("trend",["Стоїть","Росте","Падає"],P.trend)}</div>
      <div class="fld"><label for="trendKg">Якщо змінюється — на скільки кг на тиждень</label><input id="trendKg" type="number" inputmode="decimal" min="0" max="2" step="0.1" value="${nv(P.trendKg)}" placeholder="0,3"></div>
      <p class="hint">Якщо знаєш, скільки їси, це точніше за будь-яку формулу. Твою реальну підтримку порахуємо саме з цього.</p>
    </fieldset>
    <fieldset class="fs"><legend>Ціль</legend>
      ${seg("goal",["Набір маси","Рельєф","Підтримка"],P.goal)}
      <div class="fld"><span class="lb">Бюджет</span>${seg("budget",["Економ","Стандарт"],P.budget)}</div>
      <div class="fld"><label for="want">Хочу їсти, ккал на день</label><input id="want" type="number" inputmode="numeric" min="0" max="7000" value="${nv(P.want)}" placeholder="рекомендація: ${fmt(c.rec)}"></div>
      <p class="hint">Залиш порожнім — візьмемо рекомендацію.</p>
    </fieldset>
    <button class="btn" type="submit">Зберегти й оновити меню</button>
  </form>
  <div class="sec"><div class="h2">Твоя ціль на день</div><div class="card" style="display:grid;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><div class="note">${c.own?"Твоя калорійність":"Рекомендовано"}</div><div class="big num">${fmt(c.kcal)}</div></div><div style="text-align:right"><div class="note">Очікуваний темп</div><b class="num">${c.pace}</b></div></div>
    <div class="kv"><div><span>Білок</span><strong class="num">${c.prot} г</strong></div><div><span>Жири</span><strong class="num">${c.fat} г</strong></div><div><span>Вуглеводи</span><strong class="num">${c.carb} г</strong></div></div>
    <div class="rows">
      <div class="row"><span>Підтримка (вага стоїть)<br><small class="note">${c.src}</small></span><span class="num">${fmt(c.maint)} ккал</span></div>
      <div class="row"><span>${c.diff>=0?"Профіцит":"Дефіцит"} від підтримки</span><span class="num">${c.diff>=0?"+":"−"}${fmt(Math.abs(c.kcal-c.maint))} ккал · ${Math.round(Math.abs(c.diff)*100)}%</span></div>
      <div class="row"><span>Базовий обмін</span><span class="num">${fmt(c.bmr)} ккал</span></div>
      <div class="row"><span>Тренування й кардіо, в середньому</span><span class="num">${fmt(c.ex)} ккал/день</span></div>
      <div class="row"><span>Індекс маси тіла</span><span class="num">${fmt(c.bmi,1)}</span></div></div>
    ${c.warns.length?c.warns.map(w=>`<div class="warn">${w}</div>`).join(""):`<div class="okmsg">Усе в межах норми. Зважуйся 1–2 рази на тиждень зранку.</div>`}
  </div></div>
  <div class="sec"><div class="h2">Що не їм</div><button class="btn ghost" data-prefs="1" style="text-align:left;display:flex;justify-content:space-between"><span>Продукти, страви, глютен, лактоза</span><b>${np?np+" обрано":"налаштувати"}</b></button></div>
  <div class="sec"><div class="h2">Мій розклад</div><div class="card" style="display:grid;gap:12px">
    <div class="fld"><span class="lb">Прийомів їжі на день</span><div class="seg" role="group">${[[3,"без перекусу"],[4,"1 перекус"],[5,"2 перекуси"]].map(([k,l])=>`<button type="button" data-meals="${k}" aria-pressed="${k===S.meals}">${k}<small>${l}</small></button>`).join("")}</div></div>
    <div class="fld"><span class="lb">Улюблені страви</span><div class="rows">${FAVT.map(([ty,l])=>{const c=(S.fav[ty]||[]).length;return `<button class="btn ghost" data-fav="${ty}" style="text-align:left;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>${l}</span><b>${c?c+" обрано":"з готового тижня"}</b></button>`}).join("")}</div>
    <p class="hint">Тиждень складеться з улюблених по черзі. На сніданок можна обрати й основну страву — будь-що.</p></div></div></div>
  <div class="sec"><div class="h2">Готовий тиждень</div><div class="card fld"><label for="tpl">Береться для прийомів без улюблених</label><select id="tpl"><option value="">Автоматично (${esc((P.goal==="Рельєф"?"Рельєф":"Маса")+" · "+P.budget)})</option>${Object.keys(DATA.weeks).map(t=>`<option ${t===S.tpl?"selected":""}>${esc(t)}</option>`).join("")}</select></div></div>
  <div class="sec"><div class="h2">Поради</div>${TIPS.map(([t,b])=>`<details class="tip"><summary>${t}</summary><div>${b}</div></details>`).join("")}</div>
  <p class="note" style="margin-top:16px">Це орієнтир для здорових дорослих 18+, а не медична порада. Якщо є хронічні хвороби, проблеми з травленням чи ти приймаєш ліки, спершу порадься з лікарем. Витрата на тренуваннях порахована за усередненими коефіцієнтами навантаження. Ціни: ${esc(DATA.priceDate)}, без акцій.</p>`;
}

function render(){
  rebuild();buildPlan();
  renderTabs();
  $("#app").innerHTML={menu:viewMenu,shop:viewShop,prep:viewPrep,me:viewMe}[S.tab]();
  renderIntro();

/* ---- intro ---- */
const INTRO=[
 ["Меню під твою ціль","Маса чи рельєф — додаток підбирає готовий тиждень і підганяє порції саме під твої калорії.",["Звичайна домашня їжа з будь-якого супермаркету","Ціни в гривнях: видно, скільки коштує кожен день"]],
 ["Не подобається — заміни","Торкнись страви, і побачиш продукти в грамах та варіанти заміни з тією ж калорійністю.",["Список покупок збирається сам","Заготовка в неділю: ~1,5 години, і їжа на 2 дні готова"]],
 ["Почнімо","Введи вагу, зріст, активність і ціль. Це займе хвилину. Якщо знаєш, скільки зараз їси, — вкажи, так розрахунок буде точнішим.",["Потім познач продукти, які не їси","Усе можна змінити пізніше в «Профілі»"]]];
function renderIntro(){
  const el=$("#intro");
  if(S.seenIntro||S.profile){el.innerHTML="";return}
  const i=S.introStep,[h,p,li]=INTRO[i],last=i===INTRO.length-1;
  el.innerHTML=`<div class="intro" role="dialog" aria-label="Знайомство"><div><div class="step">Крок ${i+1} / ${INTRO.length}</div><h2>${h}</h2><p>${p}</p><ul>${li.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div><div class="dots">${INTRO.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
   <div class="split"><button class="btn ghost" data-intro="skip">${last?"Подивитися приклад":"Пропустити"}</button><button class="btn" data-intro="${last?"start":"next"}">${last?"Ввести дані":"Далі"}</button></div></div></div>`;
}

/* ---- sheets ---- */
function openMeal(s,di){
  if(di!=null)S.day=di;
  const m=dayMeals(S.day).find(x=>x.s==s);if(!m)return;
  const D=DISH[m.name],ing=D.items.map(([pn,g,from])=>`<div class="row"><span>${pn?esc(pn):esc(from)}${D.left.includes(pn)?' <b style="color:var(--warn)">· не їм</b>':""}${pn&&from?`<br><small class="note">замість: ${esc(short(from).toLowerCase())}</small>`:""}</span><span class="num">${fmt(Math.round(g*m.portion/5)*5)} ${pn?"г":"мл"}</span></div>`).join("")
    +D.notes.filter(x=>x.startsWith("без: ")).map(x=>`<div class="row"><span class="note">${esc(x[0].toUpperCase()+x.slice(1))}</span><span></span></div>`).join("");
  const all=Object.entries(DISH).filter(([n])=>n!==m.name&&!conflict(n)).map(([n,d])=>{const por=r1(Math.min(Math.max(m.slotKc/d.kc,.5),2.5));return {n,ty:d.type,por,p:d.p*por,cost:d.cost*por}}).sort((a,b)=>Math.abs(a.por-1)-Math.abs(b.por-1)||b.p-a.p);
  const alts=all.filter(a=>a.ty===m.slotType),other=all.filter(a=>a.ty!==m.slotType);
  const altB=a=>`<button class="alt" data-swap="${esc(m.key)}" data-to="${esc(a.n)}"><span class="a">${esc(a.n)}</span><span class="b num">×${fmt(a.por,1)} · ${fmt(a.p)} г білка<br>${fmt(a.cost)} грн</span></button>`;
  const isFav=(S.fav[m.slotType]||[]).includes(m.name),favL=FAVT.find(x=>x[0]===m.slotType)[1].toLowerCase();
  const dis=!!S.prefs.dis[m.name];
  $("#layer").innerHTML=`<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(m.name)}"><div class="in">
    <div class="grab"></div><h3>${esc(m.name)}</h3>
    ${m.bad?`<div class="warn">Ця страва тобі не підходить (${esc(m.bad)}). Обери заміну нижче${D.left.some(pn=>SUBS[pn])?" або вкажи, чим замінювати продукт, у «Що не їм»":""}.</div>`:""}
    ${D.notes.length&&!m.bad?`<div class="info">Твій варіант: ${esc(D.notes.join("; "))}.</div>`:""}
    <div class="kv card"><div><span>Порція</span><strong class="num">×${fmt(m.portion,1)}</strong></div><div><span>Ккал</span><strong class="num">${fmt(m.kc)}</strong></div><div><span>Білок</span><strong class="num">${fmt(m.p)} г</strong></div></div>
    <div><div class="grp">Продукти на цю порцію</div><div class="card rows">${ing}</div></div>
    ${m.swapped?`<button class="btn ghost" data-unswap="${esc(m.key)}">Повернути страву з плану: ${esc(m.orig)}</button>`:""}
    <div><div class="grp">Замінити на (калорії лишаться ті самі)</div><div class="rows">${alts.length?alts.map(altB).join(""):'<div class="info">Немає страв, які тобі підходять. Спробуй у «Профіль» → «Що не їм» обрати, чим замінювати продукт, який не їси.</div>'}</div></div>
    ${other.length?`<details class="tip"><summary>Інші страви на ${esc(m.lbl.toLowerCase())} (${other.length})</summary><div class="rows">${other.map(altB).join("")}</div></details>`:""}
    ${m.bad?"":`<button class="btn ghost" data-favt="${esc(m.slotType)}" data-favd="${esc(m.name)}" data-reopen="${m.s}">${isFav?"★ Прибрати з улюблених":"☆ В улюблені "+esc(favL)}</button>`}
    <button class="btn ghost" data-${dis?"undis":"dis"}="${esc(m.name)}" data-reopen="${m.s}">${dis?"Прибрати з «не подобається»":"Не подобається ця страва"}</button>
    <button class="btn ghost" data-close="1">Закрити</button></div></div>`;
  tgBack(true);
}
function subRow(n){const cur=(S.prefs.sub||{})[n]||"";
  const opts=SUBS[n].map(subLabel);
  return `<div class="subs" role="group" aria-label="Чим замінювати"><span class="lb">Замінювати на</span>${["",...opts].map(o=>`<button data-sub="${esc(n)}" data-to="${esc(o)}" aria-pressed="${o===cur}">${o?esc(o):"нічим"}</button>`).join("")}</div>`}
function openPrefs(first){
  const P=S.prefs,cats={};
  for(const p of DATA.products)if(USED.includes(p.n))(cats[p.cat]=cats[p.cat]||[]).push(p.n);
  const dl=Object.keys(P.dis);
  $("#layer").innerHTML=`<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Що не їм"><div class="in">
    <div class="grab"></div><h3>Що не їм</h3>
    ${first?`<div class="info">Останній крок. Познач, що не їси, і ми підсвітимо страви, які треба замінити. Можна пропустити.</div>`:`<p class="note">Познач продукт і, якщо хочеш, обери, чим його замінювати, — страви з ним лишаться в меню. Якщо «нічим», страва підсвітиться червоним, і ти обереш іншу.</p>`}
    <div class="tog">${[["noGl","Без глютену"],["noLac","Без лактози"],["noBob","Без бобових"]].map(([k,l])=>`<button data-flt="${k}" aria-pressed="${!!P[k]}">${l}</button>`).join("")}</div>
    ${dl.length?`<div><div class="grp">Не подобаються страви</div><div class="rows">${dl.map(n=>`<button class="item ex" data-undis="${esc(n)}"><span class="box">×</span><span class="nm">${esc(n)}</span><span class="q">повернути</span></button>`).join("")}</div></div>`:""}
    ${Object.entries(cats).map(([c,its])=>`<div><div class="grp">${esc(c)}</div><div class="rows">${its.map(n=>`<button class="item ${P.excl[n]?"ex":""}" data-ex="${esc(n)}" aria-pressed="${!!P.excl[n]}"><span class="box">${P.excl[n]?"×":""}</span><span class="nm">${esc(n)}</span><span></span></button>${P.excl[n]&&SUBS[n]?subRow(n):""}`).join("")}</div></div>`).join("")}
    <button class="btn" data-close="1">Готово</button></div></div>`;
  tgBack(true);
}
function reopenPrefs(){const sh=document.querySelector(".sheet"),y=sh?sh.scrollTop:0,first=!!document.querySelector(".sheet .info");
  openPrefs(first);const n=document.querySelector(".sheet");if(n){n.style.animation="none";n.scrollTop=y}}
function openFav(ty){
  const sel=S.fav[ty]||[],lbl=FAVT.find(x=>x[0]===ty)[1];
  const order=[ty,...Object.keys(TYPEN).filter(x=>x!==ty)];
  $("#layer").innerHTML=`<div class="scrim" data-close="1"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(lbl)}" data-sheet="fav" data-ty="${esc(ty)}"><div class="in">
    <div class="grab"></div><h3>${esc(lbl)}</h3>
    <p class="note">Обери 2 і більше страв — тиждень складеться з них по черзі, а порції підженуться під твої калорії. Нічого не обрано — страви з готового тижня.</p>
    ${order.map(t=>`<div><div class="grp">${TYPEN[t]}</div><div class="rows">${Object.keys(DISH).filter(n=>DISH[n].type===t).map(n=>{const on=sel.includes(n),bad=conflict(n);
      return `<button class="item ${on?"done fav":""}" data-fsel="${esc(n)}" aria-pressed="${on}" ${bad?"disabled":""}><span class="box">${on?"✓":""}</span><span class="nm">${esc(n)}${bad?`<div class="q">не підходить: ${esc(bad)}</div>`:""}</span><span></span></button>`}).join("")}</div></div>`).join("")}
    <div class="split">${sel.length?`<button class="btn ghost" data-fclear="1">Очистити</button>`:""}<button class="btn" data-close="1">Готово${sel.length?" · "+sel.length:""}</button></div></div></div>`;
  tgBack(true);
}
function reopenFav(){const sh=document.querySelector(".sheet"),y=sh?sh.scrollTop:0,ty=sh.dataset.ty;openFav(ty);const n=document.querySelector(".sheet");if(n){n.style.animation="none";n.scrollTop=y}}
function closeSheet(){$("#layer").innerHTML="";tgBack(false)}
function tgBack(on){if(TG())try{on?TG().BackButton.show():TG().BackButton.hide()}catch(e){}}
function fixNext(){const b=badAll()[0];S.tab="menu";if(b){S.day=b.di;render();openMeal(b.s,b.di)}else render()}

/* ---- events ---- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-close]");if(!b)return;const d=b.dataset;
  if(d.tab){S.tab=d.tab;closeSheet();render();window.scrollTo(0,0);return}
  if(d.go){S.tab=d.go;render();window.scrollTo(0,0);return}
  if(d.intro){if(d.intro==="next"){S.introStep++;renderIntro();return}
    S.seenIntro=true;save();if(d.intro==="start"){S.tab="me";S.firstPrefs=true}render();window.scrollTo(0,0);return}
  if(d.day){S.day=+d.day;render();return}
  if(d.mv!==undefined){const ms=dayMeals(S.day),i=+d.mv,j=i+(+d.dir),A=ms[i],B=ms[j];if(!A||!B)return;
    const set=(m,v)=>{if(v===m.orig)delete S.swaps[m.key];else S.swaps[m.key]=v};set(A,B.name);set(B,A.name);save();render();haptic();return}
  if(d.meal!==undefined){openMeal(d.meal);return}
  if(d.meals){S.meals=+d.meals;save();render();haptic();return}
  if(d.fav){openFav(d.fav);return}
  if(d.fsel){const ty=b.closest(".sheet").dataset.ty,L=S.fav[ty]=S.fav[ty]||[],k=L.indexOf(d.fsel);if(k<0)L.push(d.fsel);else L.splice(k,1);save();render();reopenFav();haptic();return}
  if(d.fclear){S.fav[b.closest(".sheet").dataset.ty]=[];save();render();reopenFav();return}
  if(d.favt){const L=S.fav[d.favt]=S.fav[d.favt]||[],k=L.indexOf(d.favd);if(k<0)L.push(d.favd);else L.splice(k,1);save();render();openMeal(d.reopen);haptic();return}
  if(d.fix){closeSheet();fixNext();return}
  if(d.close){closeSheet();if(S.tab!=="me")render();else render();return}
  if(d.prefs){openPrefs(false);return}
  if(d.swap){S.swaps[d.swap]=d.to;save();closeSheet();render();haptic();return}
  if(d.unswap){delete S.swaps[d.unswap];save();closeSheet();render();return}
  if(d.dis){S.prefs.dis[d.dis]=true;save();render();openMeal(d.reopen);haptic();return}
  if(d.undis){delete S.prefs.dis[d.undis];save();render();if(d.reopen!=null)openMeal(d.reopen);else b.remove();return}
  if(d.flt){S.prefs[d.flt]=!S.prefs[d.flt];b.setAttribute("aria-pressed",S.prefs[d.flt]);save();render();haptic();return}
  if(d.ex){const n=d.ex;if(S.prefs.excl[n]){delete S.prefs.excl[n];delete S.prefs.sub[n]}else S.prefs.excl[n]=true;
    save();render();reopenPrefs();haptic();return}
  if(d.sub!==undefined){if(d.to)S.prefs.sub[d.sub]=d.to;else delete S.prefs.sub[d.sub];save();render();reopenPrefs();haptic();return}
  if(d.chk){S.checked[d.chk]=!S.checked[d.chk];if(!S.checked[d.chk])delete S.checked[d.chk];save();render();haptic();return}
  if(d.reset==="ask"){$("#reset").innerHTML=`<div class="split"><button class="btn ghost" data-reset="no">Скасувати</button><button class="btn danger" data-reset="yes">Так, зняти</button></div>`;return}
  if(d.reset==="yes"){S.checked={};save();render();return}
  if(d.reset==="no"){render();return}
  if(d.seg){b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
});
document.addEventListener("change",e=>{if(e.target.id==="tpl"){S.tpl=e.target.value;save();render()}});
document.addEventListener("submit",e=>{
  if(e.target.id!=="pf")return;e.preventDefault();
  if(document.activeElement)document.activeElement.blur();
  const segv=id=>document.querySelector(`#${id} [aria-pressed="true"]`).dataset.v;
  const num=(id,lo,hi,def)=>{const v=parseFloat(String($("#"+id).value).replace(",","."));return isFinite(v)?Math.min(Math.max(v,lo),hi):def};
  const first=!S.profile;
  S.profile={sex:segv("sex"),w:num("w",40,200,65),h:num("h",140,220,178),age:Math.round(num("age",18,80,22)),
    life:LIFE.findIndex(x=>x[0]===segv("life")),strN:num("strN",0,14,0),strMin:num("strMin",0,240,0),
    cardio:+$("#cardio").value,cN:num("cN",0,14,0),cMin:num("cMin",0,300,0),
    cur:num("cur",0,7000,0),trend:segv("trend"),trendKg:num("trendKg",0,2,0),
    goal:segv("goal"),budget:segv("budget"),want:num("want",0,7000,0)};
  if(S.profile.cur>0&&S.profile.cur<800)S.profile.cur=0;
  if(S.profile.want>0&&S.profile.want<800)S.profile.want=0;
  S.seenIntro=true;save();haptic();
  if(first||S.firstPrefs){S.firstPrefs=false;S.tab="menu";render();window.scrollTo(0,0);openPrefs(true);return}
  S.tab="menu";render();window.scrollTo(0,0);
});
document.addEventListener("focusin",e=>{if(e.target.matches("input,select"))document.body.classList.add("typing")});
document.addEventListener("focusout",e=>{if(e.target.matches("input,select"))setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches("input,select"))document.body.classList.remove("typing")},50)});
function haptic(){if(TG())try{TG().HapticFeedback.impactOccurred("light")}catch(e){}}

/* ---- boot ---- */
async function boot(){
  try{const raw=await store.get("state");if(raw){const v=JSON.parse(raw);
    Object.assign(S,{profile:migrate(v.profile),swaps:migSwaps(v.swaps||{}),checked:v.checked||{},tpl:v.tpl||"",meals:[3,4,5].includes(v.meals)?v.meals:4,fav:Object.assign({Сніданок:[],Основна:[],Перекус:[]},v.fav||{}),seenIntro:!!v.seenIntro||!!v.profile,
      prefs:Object.assign({excl:{},sub:{},dis:{},noGl:false,noLac:false,noBob:false},v.prefs||{})})}}catch(e){}
  render();
}
function setTheme(t){document.documentElement.dataset.theme=t.colorScheme==="dark"?"dark":"light";
  try{const bg=getComputedStyle(document.body).backgroundColor;t.setHeaderColor&&t.setHeaderColor(bg);t.setBackgroundColor&&t.setBackgroundColor(bg)}catch(e){}}
function initTG(){const t=TG();if(!t||!t.initData)return;
  try{t.ready();t.expand();setTheme(t);
    if(t.isVersionAtLeast&&t.isVersionAtLeast("7.7")&&t.disableVerticalSwipes)t.disableVerticalSwipes();
    t.onEvent("themeChanged",()=>setTheme(t));
    t.BackButton.onClick(closeSheet);}catch(e){}}
render();
if(TG()){initTG();boot()}
else if(/tgWebApp/.test(location.hash)){
  const sc=document.createElement("script");sc.src="https://telegram.org/js/telegram-web-app.js";
  sc.onload=()=>{initTG();boot()};sc.onerror=boot;document.head.appendChild(sc);
}else boot();
</script>

</body>
